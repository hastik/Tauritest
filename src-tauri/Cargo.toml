[package]
name = "todo-app"
version = "0.1.0"
description = "Alpine.js powered todo list built with Tauri"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "todo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.9.2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-log = "2"
